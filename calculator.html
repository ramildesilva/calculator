<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tally Calculators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: instrument-panel app — fixed left index of calculators, work surface with inputs (left) and live readout (right). */
:root{
  --bg:#F1F3F0; --surface:#FFFFFF; --surface-2:#E7EBE6; --sunk:#E0E5DF; --ink:#121A17; --muted:#5A6862; --line:#D2D8D1;
  --accent:#0B6B5A; --accent-ink:#FFFFFF; --accent-soft:#DAEDE6; --accent-line:#A9D3C6;
  --c1:#0B6B5A; --c2:#CC8529; --c3:#4D69B5; --c4:#B4516A; --c5:#76882B;
  --good:#2C7A4D; --warn:#A86F13; --bad:#B03737; --good-soft:#DFF0E4; --warn-soft:#F6EAD2; --bad-soft:#F5DEDB;
  --shadow:0 1px 2px rgba(18,26,23,.06),0 6px 20px rgba(18,26,23,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#141C19; --surface-2:#1B2521; --sunk:#101715; --ink:#E3EAE6; --muted:#8FA099; --line:#27332E;
  --accent:#46C2A5; --accent-ink:#05231C; --accent-soft:#15362E; --accent-line:#24584B;
  --c1:#46C2A5; --c2:#E6A653; --c3:#8BA3EA; --c4:#E2839A; --c5:#B6C75B;
  --good:#5CC58A; --warn:#E4B14F; --bad:#EF7C74; --good-soft:#15321F; --warn-soft:#382C14; --bad-soft:#3B1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#141C19; --surface-2:#1B2521; --sunk:#101715; --ink:#E3EAE6; --muted:#8FA099; --line:#27332E;
  --accent:#46C2A5; --accent-ink:#05231C; --accent-soft:#15362E; --accent-line:#24584B;
  --c1:#46C2A5; --c2:#E6A653; --c3:#8BA3EA; --c4:#E2839A; --c5:#B6C75B;
  --good:#5CC58A; --warn:#E4B14F; --bad:#EF7C74; --good-soft:#15321F; --warn-soft:#382C14; --bad-soft:#3B1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;
  padding:10px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--f-display);font-weight:750;font-size:21px;letter-spacing:-.02em}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:15px;font-weight:600}
.search-trigger{flex:1;max-width:460px;margin-left:auto;margin-right:auto;display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);
  background:var(--surface);border-radius:999px;color:var(--muted);cursor:pointer;text-align:left}
.search-trigger:hover{border-color:var(--accent-line)}
.search-trigger span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.menu-btn{display:none}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100% - 59px)}
.sidebar{border-right:1px solid var(--line);padding-block:18px 40px;padding-inline:12px;position:sticky;top:59px;height:calc(100vh - 59px);overflow-y:auto}
.nav-sec{margin-bottom:18px}
.nav-sec h3{margin:0 0 4px;padding:0 10px;font:600 11px/1.6 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.nav-sec h3 i{width:7px;height:7px;border-radius:2px;display:inline-block}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:8px;text-decoration:none;font-size:14px;color:var(--ink)}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .fav-dot{color:var(--c2);font-size:11px}
.side-foot{padding:6px 10px;font-size:12px;color:var(--muted)}
main{min-width:0;padding-block:28px 64px;padding-inline:clamp(16px,3.2vw,44px)}
.scrim{display:none}

/* ---------- Calculator page ---------- */
.calc{max-width:1180px;margin:0 auto}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:4px}
h1{font-family:var(--f-display);font-weight:750;letter-spacing:-.025em;font-size:clamp(28px,3.4vw,38px);line-height:1.1;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:8px 0 0;max-width:68ch}
.head-actions{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent-line);color:var(--accent)}
.btn svg{width:16px;height:16px}
.btn.on{color:var(--c2);border-color:color-mix(in srgb,var(--c2) 45%,var(--line))}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07);color:var(--accent-ink)}
.calc-body{display:grid;grid-template-columns:minmax(290px,390px) minmax(0,1fr);gap:24px;margin-top:24px;align-items:start}
.calc-body.full{display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.inputs{padding:20px;display:flex;flex-direction:column;gap:16px;position:sticky;top:80px}
.inputs-title{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field .flabel{font-size:13px;font-weight:500;color:var(--ink)}
.field .hint{font-size:12px;color:var(--muted)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.frow:not(:has(.field:not([hidden]))){display:none}
.inp{display:flex;align-items:center;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r-sm);transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;border:0;background:none;padding:9px 11px;outline:none;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px}
.inp select{font-family:var(--f-body);font-size:14.5px;cursor:pointer;appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.inp select option{background:var(--surface);color:var(--ink)}
.inp textarea{resize:vertical;min-height:96px;line-height:1.5}
.inp input[type=date],.inp input[type=time]{font-family:var(--f-mono)}
.affix{padding:0 11px;color:var(--muted);font-size:13px;font-family:var(--f-mono);white-space:nowrap}
.affix:first-child{padding-right:0}
.affix:last-child{padding-left:0}
.inp.text input{font-family:var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0;height:18px}
.seg{display:flex;flex-wrap:wrap;gap:3px;padding:3px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm)}
.seg button{flex:1 1 auto;border:0;background:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.check{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}

.results{display:flex;flex-direction:column;gap:16px;min-width:0}
.primary{padding:22px 24px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--accent-line);position:relative;overflow:hidden}
.p-label{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.p-value{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:clamp(30px,4.6vw,46px);line-height:1.15;letter-spacing:-.02em;margin-top:4px;word-break:break-word}
.p-value small{font-size:.45em;font-weight:500;color:var(--muted);letter-spacing:0}
.p-sub{margin-top:6px;color:var(--ink);font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
.s-label{font-size:12px;color:var(--muted)}
.s-value{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;margin-top:2px;word-break:break-word}
.stat.good .s-value{color:var(--good)} .stat.warn .s-value{color:var(--warn)} .stat.bad .s-value{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card h4{margin:0 0 12px;font:600 13px/1.3 var(--f-body);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h4 span{color:var(--muted);font-weight:400}
.rows{margin:0;display:grid;grid-template-columns:1fr auto;column-gap:16px}
.rows dt,.rows dd{padding:9px 0;border-bottom:1px solid var(--line);margin:0}
.rows dt{color:var(--muted);font-size:14px}
.rows dd{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;font-size:14.5px}
.rows dt:nth-last-child(2),.rows dd:last-child{border-bottom:0}
.notes{font-size:13px;color:var(--muted);line-height:1.55;max-width:75ch}
.notes p{margin:0 0 6px}
.res-empty{padding:28px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);background:var(--surface)}
.res-empty strong{color:var(--ink);display:block;margin-bottom:4px}
details.tbl,details.formula{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details>summary{cursor:pointer;padding:14px 20px;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);font-size:17px}
details[open]>summary::after{content:"−"}
details>summary:hover{background:var(--surface-2)}
.tbl-wrap{max-height:420px;overflow:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 14px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;background:var(--surface-2);font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
tbody td{font-family:var(--f-mono);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
tbody tr:hover td{background:var(--surface-2)}
.formula-body{padding:4px 20px 18px;font-size:14px;color:var(--muted);max-width:78ch}
.formula-body code{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);padding:2px 6px;border-radius:5px;color:var(--ink)}

/* charts */
.chart{position:relative}
.chart-svg{width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--muted);stroke-width:1;opacity:.7}
.chart .tick{fill:var(--muted);font:11px var(--f-mono)}
.chart .lbl{fill:var(--ink);font:600 12px var(--f-body)}
.chart .hover-line{stroke:var(--muted);stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.5;white-space:nowrap;z-index:5;box-shadow:var(--shadow)}
.tip b{font-family:var(--f-mono);font-weight:600}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut-wrap svg{width:170px;height:170px;flex:none}
.donut-legend{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.dl-row{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;font-size:14px}
.dl-row i{width:12px;height:12px;border-radius:3px}
.dl-row b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.dl-row em{font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:12px;min-width:44px;text-align:right}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:12px;align-items:center;font-size:13.5px}
.hbar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .fill{height:100%;border-radius:5px;background:var(--accent)}
.hbar b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding:6px 11px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:15px}

/* ---------- Scientific ---------- */
.sci-wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.sci{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.sci-display{background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:10px 14px 12px;margin-bottom:12px}
.sci-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:18px}
.sci-flags{display:flex;gap:6px}
.sci-flags span{font:600 10px/1 var(--f-mono);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.sci-flags span.lit{background:var(--accent-soft);color:var(--accent)}
.sci-prev{font:12px var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sci-expr{width:100%;border:0;background:none;outline:none;font:500 19px/1.4 var(--f-mono);text-align:right;padding:6px 0 0;color:var(--ink)}
.sci-result{font:600 34px/1.2 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-x:auto;white-space:nowrap;letter-spacing:-.02em;scrollbar-width:none}
.sci-result.preview{color:var(--muted);font-weight:500}
.sci-result.err{color:var(--bad);font-size:16px;font-family:var(--f-body);padding-top:10px}
.sci-result sup{font-size:.55em}
.sci-pads{display:grid;grid-template-columns:5fr 4fr;gap:12px}
.pad{display:grid;gap:6px}
.pad.fn{grid-template-columns:repeat(5,1fr)}
.pad.nm{grid-template-columns:repeat(4,1fr)}
.key{border:1px solid var(--line);border-bottom-width:2px;background:var(--surface-2);border-radius:9px;min-height:44px;padding:4px;cursor:pointer;font:500 15px var(--f-mono);transition:transform .05s,background .12s;touch-action:manipulation;user-select:none}
.key:hover{background:var(--sunk)}
.key:active{transform:translateY(1px);border-bottom-width:1px}
.pad.fn .key{font-size:13px;min-height:38px;background:var(--surface)}
.pad.fn .key:hover{background:var(--surface-2)}
.key.d{background:var(--surface);font-size:18px}
.key.op{color:var(--accent);font-size:19px}
.key.eq{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:20px}
.key.eq:hover{filter:brightness(1.08);background:var(--accent)}
.key.clr{color:var(--bad)}
.key.lit{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.sci-side{display:flex;flex-direction:column;gap:12px}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hist-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.hist-head button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12.5px}
.hist-head button:hover{color:var(--bad)}
.hist-list{max-height:330px;overflow-y:auto}
.hist-item{display:block;width:100%;text-align:right;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 14px;cursor:pointer}
.hist-item:hover{background:var(--surface-2)}
.hist-item .he{font:12.5px var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-item .hr{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.hist-empty{padding:18px 14px;color:var(--muted);font-size:13px}
.tips{font-size:12.5px;color:var(--muted);line-height:1.6;padding:12px 14px;border:1px dashed var(--line);border-radius:var(--r)}
.tips code{font-family:var(--f-mono);color:var(--ink);background:var(--surface-2);padding:1px 5px;border-radius:4px}

/* ---------- Home ---------- */
.home{max-width:1180px;margin:0 auto}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:40px;align-items:center;padding-bottom:36px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(34px,4.6vw,56px);line-height:1.02;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--muted);font-size:16.5px;max-width:46ch;margin:16px 0 22px}
.hero-search{display:flex;align-items:center;gap:12px;width:100%;max-width:440px;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted);font-size:15px;box-shadow:var(--shadow);text-align:left}
.hero-search:hover{border-color:var(--accent)}
.hero-search span{flex:1}
.quick{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.quick-label{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-size:13.5px}
.qchip:hover{border-color:var(--accent);color:var(--accent)}
.hero .sci .pad.fn .key{min-height:34px}
.hero .sci .key{min-height:40px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:36px}
.cat{scroll-margin-top:80px}
.cat-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.cat-head h2{font-family:var(--f-display);font-weight:650;font-size:21px;letter-spacing:-.02em;margin:0}
.cat-head span{font:12px var(--f-mono);color:var(--muted);margin-left:auto}
.cat-list{list-style:none;margin:0;padding:0}
.cat-list a{display:block;padding:9px 8px;margin:0 -8px;border-radius:8px;text-decoration:none}
.cat-list a:hover{background:var(--surface)}
.cat-list a b{display:block;font-weight:600;font-size:14.5px}
.cat-list a small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.cat.flash .cat-head{border-color:var(--accent)}
.home-foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 24px}

/* ---------- Conversion / GPA / password ---------- */
.conv{display:flex;flex-direction:column;gap:20px}
.conv-cats{display:flex;flex-wrap:wrap;gap:6px}
.conv-cats button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px}
.conv-cats button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.conv-main{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:end;padding:20px}
.conv-main .inp input{font-size:22px;padding:12px}
.conv-main .inp select{font-size:14px}
.conv-out{font:600 26px var(--f-mono);padding:10px 12px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent-line);overflow-x:auto;white-space:nowrap}
.conv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.conv-cell{padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;text-align:left}
.conv-cell:hover{border-color:var(--accent-line)}
.conv-cell.is-to{border-color:var(--accent);background:var(--accent-soft)}
.conv-cell small{display:block;color:var(--muted);font-size:12px}
.conv-cell b{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;word-break:break-all}
.gpa-rows{display:flex;flex-direction:column;gap:8px}
.gpa-row{display:grid;grid-template-columns:minmax(0,1fr) 74px 86px 34px;gap:6px;align-items:center}
.gpa-row .inp input,.gpa-row .inp select{padding:8px 9px;font-size:14px}
.gpa-row .inp.name input{font-family:var(--f-body)}
.gpa-head{display:grid;grid-template-columns:minmax(0,1fr) 74px 86px 34px;gap:6px;font-size:12px;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;border-radius:7px;height:34px}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.pw-list{display:flex;flex-direction:column;gap:8px}
.pw{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
.pw code{flex:1;min-width:0;font:500 15.5px var(--f-mono);word-break:break-all;letter-spacing:.02em}
.pw.big{background:var(--accent-soft);border-color:var(--accent-line);padding:18px}
.pw.big code{font-size:clamp(17px,2.4vw,22px)}
.meter{display:flex;gap:4px;margin-top:8px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 6px 2px}
.frac span:last-child{padding-top:2px}

/* ---------- Palette & toast ---------- */
.palette{position:fixed;inset:0;z-index:60;background:rgba(10,16,14,.45);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal-box{width:100%;max-width:580px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal-in input{flex:1;border:0;background:none;outline:none;font-size:17px;color:var(--ink)}
.pal-list{max-height:min(420px,56vh);overflow-y:auto;padding:6px}
.pal-group{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 12px 6px}
.pal-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer;text-decoration:none}
.pal-item small{color:var(--muted);font-size:12.5px;display:block}
.pal-item .cat-tag{font-size:11.5px;color:var(--muted);white-space:nowrap}
.pal-item.sel{background:var(--accent-soft)}
.pal-empty{padding:24px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:70;box-shadow:var(--shadow)}

/* ---------- Responsive ---------- */
@media (max-width:1060px){ .sci-wrap{grid-template-columns:1fr} .hero{grid-template-columns:1fr} }
@media (max-width:900px){
  .calc-body{grid-template-columns:1fr}
  .inputs{position:static}
  .shell{grid-template-columns:1fr}
  .menu-btn{display:grid}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;height:100%;z-index:50;background:var(--bg);transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px));box-shadow:var(--shadow)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;z-index:40;background:rgba(10,16,14,.4)}
}
@media (max-width:600px){
  .topbar{padding:10px 12px;gap:6px}
  .search-trigger kbd,.brand-text{display:none}
  .sci-pads{grid-template-columns:1fr}
  .conv-main{grid-template-columns:1fr}
  .conv-main .swap{justify-self:center;transform:rotate(90deg)}
  .head-actions .btn span{display:none}
  .hbar{grid-template-columns:90px 1fr auto}
  .gpa-row,.gpa-head{grid-template-columns:minmax(0,1fr) 58px 76px 30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>

/* ====================== Icons ====================== */
const I = {

/* ====================== Expression parser ====================== */
const Expr = (() => {
  const FNS = ['asinh','acosh','atanh','asin','acos','atan','sinh','cosh','tanh','sin','cos','tan','sqrt','cbrt','abs','exp','ln','log','floor','ceil','round'];

/* ====================== Charts ====================== */
function niceTicks(min, max, count = 5) {

{ id: 'compound', name: 'Compound Interest', cat: 'finance', kw: 'investment savings growth future value interest',
  desc: 'Grow a starting balance with regular contributions, rising deposits and inflation-adjusted results.',
  fields: [
    {id: 'initial', label: 'Starting balance', type: 'num', prefix: '$', value: 10000},
    {type: 'row', fields: [
      {id: 'contrib', label: 'Contribution', type: 'num', prefix: '$', value: 500},
      {id: 'freq', label: 'Every', type: 'select', value: 'monthly', options: [['monthly', 'Month'], ['annual', 'Year']]}]},
    {id: 'rate', label: 'Annual return', type: 'num', suffix: '%', value: 7, range: [0, 15, 0.1]},
    {id: 'years', label: 'Years', type: 'num', suffix: 'years', value: 25, range: [1, 50, 1]},
    {id: 'comp', label: 'Compounding', type: 'seg', value: 'monthly', options: [['annually', 'Yearly'], ['quarterly', 'Quarterly'], ['monthly', 'Monthly'], ['daily', 'Daily']]},
    {type: 'row', fields: [
      {id: 'raise', label: 'Raise deposits', type: 'num', suffix: '%/yr', value: 2},
      {id: 'infl', label: 'Inflation', type: 'num', suffix: '%/yr', value: 2.5}]}
  ],
  formula: 'Each month the balance grows by <code>(1 + r/k)<sup>k/12</sup> − 1</code>, where k is the number of compounding periods per year. Deposits are added at the end of each period and rise by the chosen percentage every year. Real value divides by <code>(1 + inflation)<sup>years</sup></code>.',
  compute(v) {
    const k = {annually: 1, quarterly: 4, monthly: 12, daily: 365}[v.comp], mr = Math.pow(1 + v.rate / 100 / k, k / 12) - 1, months = Math.round(v.years * 12);
    if (months < 1) return {error: 'Enter at least one month.'};
    let bal = v.initial, put = v.initial; const X = ['0'], C = [v.initial], G = [0], rows = [];
    for (let m = 1; m <= months; m++) {
      const yi = Math.floor((m - 1) / 12), dep = v.contrib * Math.pow(1 + v.raise / 100, yi);
      bal *= 1 + mr;
      if (v.freq === 'monthly') { bal += dep; put += dep; } else if (m % 12 === 0) { bal += dep; put += dep; }
      if (m % 12 === 0 || m === months) { X.push(String(Math.ceil(m / 12))); C.push(put); G.push(bal - put); rows.push([Math.ceil(m / 12), money0(put), money0(bal - put), money0(bal), money0(bal / Math.pow(1 + v.infl / 100, m / 12))]); }
    }
    const real = bal / Math.pow(1 + v.infl / 100, months / 12);
    return {
      primary: {label: `Balance after ${num(v.years, 1)} years`, value: money0(bal), sub: `Worth ${money0(real)} in today's dollars at ${pct(v.infl, 1)} inflation`},
      stats: [{label: 'Total deposited', value: money0(put)}, {label: 'Interest earned', value: money0(bal - put), tone: 'good'}, {label: 'Growth multiple', value: num(bal / Math.max(put, 1), 2) + '×'}, {label: 'Effective annual rate', value: pct((Math.pow(1 + mr, 12) - 1) * 100, 3)}],
      charts: [{type: 'line', stacked: true, heading: 'Deposits vs. growth', x: X, xName: 'Year', series: [{name: 'Deposits', data: C, color: 'var(--c3)'}, {name: 'Interest', data: G, color: 'var(--c1)'}], yFmt: compact$, tipFmt: money0}],

    };

{ id: 'retirement', name: 'Retirement', cat: 'finance', kw: 'nest egg 401k ira pension savings plan',
  desc: 'Will your savings last? Projects your nest egg, what you need, and the income it can sustain.',
  fields: [
    {type: 'row', fields: [
      {id: 'age', label: 'Current age', type: 'num', value: 35},
      {id: 'retire', label: 'Retire at', type: 'num', value: 65},
      {id: 'life', label: 'Plan to', type: 'num', value: 92}]},
    {id: 'saved', label: 'Saved so far', type: 'num', prefix: '$', value: 85000},
    {id: 'contrib', label: 'Monthly saving', type: 'num', prefix: '$', value: 1200},
    {type: 'row', fields: [
      {id: 'pre', label: 'Return before', type: 'num', suffix: '%', value: 7},
      {id: 'post', label: 'Return after', type: 'num', suffix: '%', value: 5}]},
    {id: 'income', label: 'Income needed in retirement', type: 'num', prefix: '$', suffix: '/yr', value: 70000, hint: "In today's dollars"},
    {id: 'other', label: 'Social Security & pensions', type: 'num', prefix: '$', suffix: '/yr', value: 24000},
    {id: 'infl', label: 'Inflation', type: 'num', suffix: '%', value: 2.8}
  ],
  formula: 'Savings grow monthly until retirement. Each retirement year withdraws the shortfall (income need minus other income), raised by inflation, before returns are applied. The required nest egg is the present value of those withdrawals.',
  compute(v) {
    const yrs = v.retire - v.age, ret = v.life - v.retire;
    if (yrs <= 0 || ret <= 0) return {error: 'Retirement age should fall between your current age and the age you plan to.'};
    let bal = v.saved; const mr = Math.pow(1 + v.pre / 100, 1 / 12) - 1, ages = [String(v.age)], B = [bal];
    for (let m = 1; m <= yrs * 12; m++) { bal = bal * (1 + mr) + v.contrib; if (m % 12 === 0) { ages.push(String(v.age + m / 12)); B.push(bal); } }
    const nest = bal, inf = 1 + v.infl / 100, gr = 1 + v.post / 100, need0 = Math.max(0, v.income - v.other) * Math.pow(inf, yrs);
    let factor = 0; for (let t = 0; t < ret; t++) factor += Math.pow(inf / gr, t);
    const required = need0 * factor;
    let b = nest, outAge = null;
    for (let t = 0; t < ret; t++) { b -= need0 * Math.pow(inf, t); if (b < 0 && outAge == null) outAge = v.retire + t; b = Math.max(0, b) * gr; ages.push(String(v.retire + t + 1)); B.push(b); }
    const sustain = nest / factor / Math.pow(inf, yrs) + v.other, gap = nest - required;
    const extraMonthly = gap < 0 ? -gap / ((Math.pow(1 + mr, yrs * 12) - 1) / mr || yrs * 12) : 0;
    return {
      primary: {label: `Savings at age ${v.retire}`, value: money0(nest), sub: gap >= 0 ? `<span class="pill good">On track</span> ${money0(gap)} more than you need` : `<span class="pill bad">Shortfall</span> ${money0(-gap)} less than you need`},
      stats: [
        {label: 'Nest egg needed', value: money0(required)},
        {label: "Sustainable income (today's $)", value: money0(sustain) + '/yr', tone: sustain >= v.income ? 'good' : 'warn'},
        {label: 'Money lasts until', value: outAge ? 'Age ' + outAge : `Past ${v.life}`, tone: outAge ? 'bad' : 'good'},
        gap < 0 ? {label: 'Extra saving to close gap', value: money0(extraMonthly) + '/mo', tone: 'warn'} : {label: 'Left at age ' + v.life, value: money0(b)}
      ],
      charts: [{type: 'line', heading: 'Projected balance by age', x: ages, xName: 'Age', series: [{name: 'Balance', data: B, color: 'var(--c1)', area: true}], yFmt: compact$, tipFmt: money0}],
      notes: 'Projections assume steady returns. Real markets vary year to year, so treat this as a planning estimate.'
    };
  }},

  desc: 'See what money costs or buys over time at a steady inflation rate.',
  fields: [
    {id: 'mode', label: 'I want to know', type: 'seg', value: 'future', options: [['future', 'Future cost'], ['power', 'Future buying power']]},

{ id: 'calorie', name: 'Calorie & TDEE', cat: 'health', kw: 'tdee bmr calories diet macro weight loss maintenance',
  desc: 'Daily energy needs, BMR, and calorie targets for losing, keeping or gaining weight, with macros.',
  fields: [UNITS, SEX, AGE, ...HEIGHT, ...WEIGHT,
    {id: 'act', label: 'Activity', type: 'select', value: '1.55', options: [['1.2', 'Sedentary: desk job, little exercise'], ['1.375', 'Light: exercise 1–3 days/week'], ['1.55', 'Moderate: exercise 3–5 days/week'], ['1.725', 'Active: hard exercise 6–7 days/week'], ['1.9', 'Very active: physical job plus training']]},

    {id: 'ang', label: 'Trig angles', type: 'seg', value: 'rad', options: [['rad', 'Radians'], ['deg', 'Degrees']]}
  ],
  compute(v) {
    if (!(v.xmax > v.xmin)) return {error: '“x to” must be greater than “x from”.'};
    const cols = ['var(--c1)', 'var(--c2)', 'var(--c3)'], names = ['f', 'g', 'h'], fns = [], errs = [];

    if (!fns.length) return {error: errs[0] || 'Enter at least one function of x, such as x^2 − 3.'};
    const roots = (f, lim = 8) => { const out = [], N = 2000; let px = v.xmin, py = f(px); for (let i = 1; i <= N; i++) { const x = v.xmin + (v.xmax - v.xmin) * i / N, y = f(x); if (fin(py) && fin(y)) { if (y === 0) out.push(x); else if (py * y < 0 && Math.abs(y - py) < 1e3) { let a = px, b = x; for (let j = 0; j < 60; j++) { const m = (a + b) / 2; f(a) * f(m) <= 0 ? b = m : a = m; } out.push((a + b) / 2); } } px = x; py = y; if (out.length >= lim) break; } return out; };
    const pts = [], rows = [];
    fns.forEach(fn => { const r = roots(x => fn.f(x)); r.forEach(x => pts.push({x, y: 0, color: fn.color})); rows.push([`Roots of ${fn.n}(x)`, r.length ? r.map(x => num(x, 4)).join(', ') : 'None in range']); });
    if (fns.length > 1) { const a = fns[0], b = fns[1], r = roots(x => a.f(x) - b.f(x)); r.forEach(x => pts.push({x, y: a.f(x), color: 'var(--ink)', label: `(${num(x, 2)}, ${num(a.f(x), 2)})`})); rows.push([`${a.n}(x) = ${b.n}(x) at`, r.length ? r.map(x => `x = ${num(x, 4)}`).join(', ') : 'No intersection in range']); }
    return {charts: [{type: 'plot', xmin: v.xmin, xmax: v.xmax, fns, points: pts}], rows, notes: (errs.length ? `<p style="color:var(--bad)">${errs.map(esc).join('<br>')}</p>` : '') + '<p>Use <code>^</code> for powers and functions like <code>sqrt</code>, <code>ln</code>, <code>log</code>, <code>abs</code>, <code>sin</code>. Implicit multiplication works: <code>2x</code>, <code>3sin(x)</code>.</p>'};

{ id: 'fraction', name: 'Fraction', cat: 'math', kw: 'fraction add subtract multiply divide simplify mixed number',
  desc: 'Add, subtract, multiply and divide fractions, simplified to lowest terms and mixed numbers.',
  fields: [
    {type: 'row', fields: [{id: 'n1', label: 'First fraction', type: 'num', value: 3, suffix: 'top'}, {id: 'd1', label: ' ', err: 'First denominator', type: 'num', value: 4, suffix: 'bottom'}]},
    {id: 'op', label: 'Operation', type: 'seg', value: '+', options: [['+', '+'], ['-', '−'], ['*', '×'], ['/', '÷']]},
    {type: 'row', fields: [{id: 'n2', label: 'Second fraction', type: 'num', value: 5, suffix: 'top'}, {id: 'd2', label: ' ', err: 'Second denominator', type: 'num', value: 6, suffix: 'bottom'}]}
  ],
  compute(v) {
    const ints = [v.n1, v.d1, v.n2, v.d2].every(Number.isInteger); if (!ints) return {error: 'Use whole numbers for numerators and denominators.'};
    if (!v.d1 || !v.d2) return {error: 'Denominators cannot be zero.'};
    const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
    let n, d, step;
    if (v.op === '+' || v.op === '-') { const l = Math.abs(v.d1 * v.d2) / gcd(v.d1, v.d2), a = v.n1 * l / v.d1, b = v.n2 * l / v.d2; n = v.op === '+' ? a + b : a - b; d = l; step = `Common denominator ${l}: ${a}/${l} ${v.op === '+' ? '+' : '−'} ${b}/${l} = ${n}/${l}`; }
    else if (v.op === '*') { n = v.n1 * v.n2; d = v.d1 * v.d2; step = `Multiply across: (${v.n1}×${v.n2}) / (${v.d1}×${v.d2}) = ${n}/${d}`; }
    else { if (!v.n2) return {error: 'Cannot divide by a fraction equal to zero.'}; n = v.n1 * v.d2; d = v.d1 * v.n2; step = `Multiply by the reciprocal: ${v.n1}/${v.d1} × ${v.d2}/${v.n2} = ${n}/${d}`; }
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d), sn = n / g, sd = d / g, whole = Math.trunc(sn / sd), rem = Math.abs(sn % sd);
    const fr = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
    return {
      primary: {label: 'Result', value: sd === 1 ? String(sn) : fr(sn, sd), sub: `${fr(v.n1, v.d1)} ${{'+': '+', '-': '−', '*': '×', '/': '÷'}[v.op]} ${fr(v.n2, v.d2)}`},
      stats: [{label: 'Decimal', value: num(sn / sd, 10)}, {label: 'Mixed number', value: sd === 1 ? String(sn) : whole ? `${whole} ${rem}/${sd}` : `${sn}/${sd}`}, {label: 'Percent', value: pct(sn / sd * 100, 4)}],
      rows: [['Step 1', step], ['Step 2', g > 1 ? `Divide top and bottom by ${g}: ${sn}/${sd}` : 'Already in lowest terms']]
    };
  }},

  compute(v) {
    const xs = String(v.data).split(/[\s,;]+/).map(Number).filter(fin);

  const rb = $('#resetBtn'); if (rb) rb.onclick = () => { initVals(calc, true); walk(calc.fields, f => f.shared && (shared[f.shared] = vals[calc.id][f.id])); saveVals(); renderFieldCalc(calc, body); toast('Reset to example values'); };
  if (calc.id === 'scientific') setTimeout(() => { if (matchMedia('(pointer:fine)').matches) $('#sci-expr')?.focus(); }, 0);
}
function route() {

  document.body.classList.remove('nav-open');
  if (byId[h]) { renderCalc(byId[h]); renderSidebar(h); window.scrollTo(0, 0); }
  else { current = null; renderSidebar('home'); renderHome(h.startsWith('cat-') ? h.slice(4) : null); if (!h.startsWith('cat-')) window.scrollTo(0, 0); }
}
window.addEventListener('hashchange', route);

/* ---------- Command palette ---------- */
const pal = $('#palette'), palIn = $('#palInput'), palList = $('#palList'); let palItems = [], palSel = 0;
function score(c, q) {
  const n = c.name.toLowerCase(), kw = (c.kw || '').toLowerCase(), d = c.desc.toLowerCase(); let s = 0;
  for (const w of q.split(/\s+/).filter(Boolean)) {
    let t = 0; if (n.startsWith(w)) t = 100; else if (n.includes(w)) t = 80; else if (kw.split(' ').some(k => k.startsWith(w))) t = 60; else if (kw.includes(w)) t = 45; else if (d.includes(w)) t = 30;
    else { let i = 0; for (const ch of n) if (ch === w[i]) i++; if (i === w.length && w.length > 1) t = 15; }
    if (!t) return 0; s += t;
  }

}
function renderPalette(q) {
  q = q.trim().toLowerCase(); let html = '';
  if (!q) {
    const rec = recent.map(id => byId[id]).filter(Boolean).slice(0, 5); palItems = [...rec, ...CALCS.filter(c => !rec.includes(c))];
    const g = (label, list, off) => list.length ? `<div class="pal-group">${label}</div>` + list.map((c, i) => item(c, off + i)).join('') : '';
    html = g('Recent', rec, 0) + g('All calculators', palItems.slice(rec.length), rec.length);
  } else { palItems = CALCS.map(c => [c, score(c, q)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).map(x => x[0]); html = palItems.map((c, i) => item(c, i)).join('') || `<div class="pal-empty">No calculator matches “${esc(q)}”. Try a broader word like loan, weight or date.</div>`; }
  palSel = 0; palList.innerHTML = html; highlight();
  function item(c, i) { return `<a class="pal-item" href="#${c.id}" data-i="${i}"><div><div>${esc(c.name)}</div><small>${esc(c.desc)}</small></div><span class="cat-tag">${CATS.find(x => x.id === c.cat).name}</span></a>`; }
}
function highlight() { $$('.pal-item', palList).forEach(el => el.classList.toggle('sel', +el.dataset.i === palSel)); const s = $('.pal-item.sel', palList); if (s) s.scrollIntoView({block: 'nearest'}); }
function openPalette() { pal.hidden = false; palIn.value = ''; renderPalette(''); palIn.focus(); }
function closePalette() { pal.hidden = true; }
palIn.addEventListener('input', () => renderPalette(palIn.value));
palIn.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); highlight(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); highlight(); }
  else if (e.key === 'Enter') { e.preventDefault(); const c = palItems[palSel]; if (c) { closePalette(); location.hash = c.id; } }
  else if (e.key === 'Escape') closePalette();
});
pal.addEventListener('click', e => { if (e.target === pal) closePalette(); else if (e.target.closest('.pal-item')) closePalette(); });
palList.addEventListener('mousemove', e => { const it = e.target.closest('.pal-item'); if (it && +it.dataset.i !== palSel) { palSel = +it.dataset.i; highlight(); } });
$('#searchBtn').onclick = openPalette;
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !typing)) { e.preventDefault(); pal.hidden ? openPalette() : closePalette(); return; }
  if (e.key === 'Escape' && !pal.hidden) closePalette();
  if (!typing && pal.hidden && !e.metaKey && !e.ctrlKey && !e.altKey && e.key.length === 1 && /[\d.+\-*/^()a-z]/i.test(e.key)) { const s = $('.sci-expr'); if (s) s.focus(); }
});

/* ---------- Theme & mobile nav ---------- */
const root = document.documentElement, savedTheme = store.get('theme', null);
if (savedTheme) root.dataset.theme = savedTheme;
$('#themeBtn').onclick = () => { const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', root.dataset.theme); if (current && current.fields) recompute(current); };
$('#menuBtn').onclick = () => document.body.classList.toggle('nav-open');
$('#scrim').onclick = () => document.body.classList.remove('nav-open');

route();
})();
